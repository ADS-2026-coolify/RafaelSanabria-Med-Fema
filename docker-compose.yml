services:
  mysql:
    image: mysql:8.4
    container_name: medfema-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medfema
      MYSQL_USER: medfema
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - medfema_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: jdbc:mysql://mysql:3306/medfema
      DB_USER: medfema
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD}
      APP_USER: ${APP_USER:?Configure APP_USER}
      APP_PASSWORD: ${APP_PASSWORD:?Configure APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Configure CORS_ORIGIN}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - "80"

volumes:
  medfema_mysql:
